<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FutureWay - ผู้ดูแลระบบ</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <header class="admin-header">
    <a href="main.html" class="back-btn" aria-label="ย้อนกลับ"><i class="fas fa-arrow-left"></i></a>
    <span class="title"><i class="fas fa-user-shield"></i> ผลการทำแบบทดสอบทั้งหมด</span>
    <span class="who" id="who"></span>
  </header>

  <div class="admin-wrap">

    <!-- การ์ดกันคนที่ไม่ใช่แอดมิน — โผล่แทนหน้าทั้งหมด -->
    <div class="denied-card" id="denied" hidden>
      <i class="fas fa-lock"></i>
      <h2 id="denied-title">ไม่มีสิทธิ์เข้าถึง</h2>
      <p id="denied-msg"></p>
      <a href="main.html" class="denied-btn"><i class="fas fa-arrow-left"></i> กลับหน้าหลัก</a>
    </div>

    <div class="stat-grid" id="stat-grid"></div>

    <form class="filter-bar" id="filter-form" autocomplete="off">
      <input type="search" id="f-q" placeholder="ค้นหาชื่อ นามสกุล username หรืออีเมล">
      <select id="f-gender"><option value="">ทุกเพศ</option></select>
      <select id="f-mbti"><option value="">ทุกผล MBTI</option></select>
      <button type="submit"><i class="fas fa-search"></i> ค้นหา</button>
    </form>

    <div class="export-bar" id="export-bar">
      <div class="export-info">
        <i class="fas fa-file-excel"></i>
        <span>ส่งออกข้อมูลเป็นไฟล์ Excel (.xlsx) — มีชีตผลการทำแบบทดสอบและชีตสรุปสถิติ</span>
      </div>
      <div class="export-actions">
        <button type="button" class="export-btn ghost" id="export-filtered" hidden>
          <i class="fas fa-filter"></i> เฉพาะที่กรองอยู่
        </button>
        <button type="button" class="export-btn" id="export-all">
          <i class="fas fa-file-excel"></i> ส่งออกทั้งหมด
        </button>
      </div>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <table class="admin-table">
          <thead>
            <tr>
              <th>ผู้ใช้</th>
              <th>เพศ</th>
              <th>MBTI</th>
              <th>หมวดหมู่ 1</th>
              <th>หมวดหมู่ 2</th>
              <th>หมวดหมู่ 3</th>
              <th>เกรดเฉลี่ย</th>
              <th>วันที่ทำ</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="9"><div class="state-box"><i class="fas fa-spinner fa-spin"></i>กำลังโหลด...</div></td></tr>
          </tbody>
        </table>
      </div>
      <div class="pager" id="pager" hidden>
        <button type="button" id="prev"><i class="fas fa-chevron-left"></i> ก่อนหน้า</button>
        <span class="info" id="pager-info"></span>
        <button type="button" id="next">ถัดไป <i class="fas fa-chevron-right"></i></button>
      </div>
    </div>

  </div>

  <script src="js/common.js"></script>
  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
