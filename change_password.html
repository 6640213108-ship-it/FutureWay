<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FutureWay - เปลี่ยนรหัสผ่าน</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/settings.css">
</head>
<body>

  <header class="back-header" data-title="เปลี่ยนรหัสผ่าน" data-back="profile.html"></header>

  <div class="settings-content">

    <form id="pw-form" class="settings-card">
      <div class="card-head">
        <i class="fas fa-lock"></i>
        <h2>ตั้งรหัสผ่านใหม่</h2>
      </div>
      <p class="card-desc">ต้องกรอกรหัสผ่านเดิมเพื่อยืนยันว่าเป็นเจ้าของบัญชีจริง</p>

      <div class="alert err" id="alert-err" hidden><i class="fas fa-circle-exclamation"></i><span></span></div>
      <div class="alert ok"  id="alert-ok"  hidden><i class="fas fa-circle-check"></i><span></span></div>

      <div class="field">
        <label for="current">รหัสผ่านเดิม <span class="required">*</span></label>
        <div class="pw-wrap">
          <input type="password" id="current" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" data-target="current" aria-label="แสดงรหัสผ่าน"><i class="fas fa-eye"></i></button>
        </div>
      </div>

      <div class="field">
        <label for="newpw">รหัสผ่านใหม่ <span class="required">*</span></label>
        <div class="pw-wrap">
          <input type="password" id="newpw" autocomplete="new-password" minlength="6" required>
          <button type="button" class="pw-toggle" data-target="newpw" aria-label="แสดงรหัสผ่าน"><i class="fas fa-eye"></i></button>
        </div>
        <div class="pw-meter" id="meter"><span></span></div>
        <span class="pw-label" id="meter-label">อย่างน้อย 6 ตัวอักษร</span>
      </div>

      <div class="field">
        <label for="confirm">ยืนยันรหัสผ่านใหม่ <span class="required">*</span></label>
        <div class="pw-wrap">
          <input type="password" id="confirm" autocomplete="new-password" required>
          <button type="button" class="pw-toggle" data-target="confirm" aria-label="แสดงรหัสผ่าน"><i class="fas fa-eye"></i></button>
        </div>
        <span class="hint" id="match-hint"></span>
      </div>

      <div class="btn-row">
        <a href="profile.html" class="btn btn-ghost">ยกเลิก</a>
        <button type="submit" class="btn btn-primary" id="save-btn">
          <i class="fas fa-key"></i>เปลี่ยนรหัสผ่าน
        </button>
      </div>
    </form>

  </div>

  <script src="js/common.js"></script>
  <script src="js/change-password.js"></script>
</body>
</html>
