<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FutureWay - เข้าสู่ระบบ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="box">
    <h1 class="title">FutureWay</h1>
    <h2 class="subtitle">ยินดีต้อนรับ</h2>
    <p class="desc">เรารู้สึกยินดีที่ได้คุณมาที่นี่</p>
    <small class="note">กรุณากรอกข้อมูลเพื่อเริ่มต้นการใช้งาน</small>

    <form id="login-form" novalidate>

      <div class="input-box">
        <img src="images/account_circle_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.png" class="icon" alt="">
        <input type="text" name="username" placeholder="ชื่อผู้ใช้ (เบอร์มือถือ)" autocomplete="username" required>
      </div>

      <div class="input-box">
        <i class="fa-solid fa-lock icon-left"></i>
        <input type="password" name="password" id="password" placeholder="รหัสผ่าน" autocomplete="current-password" required>
        <i class="fa-solid fa-eye toggle" data-target="password" role="button" aria-label="แสดงรหัสผ่าน"></i>
      </div>

      <div class="form-footer">
        <button type="submit" class="btn btn-purple">เข้าสู่ระบบ</button>
        <a href="register.html" class="btn btn-purple-outline">ยังไม่มีบัญชี? สมัครเลย</a>
        <a href="index.html" class="btn-purple-outline_t">กลับหน้าแรก</a>
      </div>

    </form>

    <div class="divider">หรือเข้าสู่ระบบด้วย</div>

    <div class="social-buttons">
      <button type="button" class="btn-social google">
        <img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" alt="Google">
        Google
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="js/common.js"></script>
  <script src="js/google-login.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
