<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FutureWay</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- ?v=2 บังคับให้เบราว์เซอร์โหลด CSS ใหม่ ไม่ใช้ตัวที่ cache ไว้
       (เลขนี้เปลี่ยนทุกครั้งที่แก้ main.css แล้วอยากให้ผู้ใช้เห็นผลทันที) -->
  <link rel="stylesheet" href="css/main.css?v=2">

  <!--
    สไตล์ของ Lightbox (popup ดูรูปเต็มจอ) อยู่ตรงนี้ ไม่ได้อยู่ใน main.css
    เพราะถ้า CSS ถูก cache ไว้ จะได้ HTML+script ใหม่แต่ไม่ได้สไตล์
    ผลคือกดรูปแล้ว popup เปิดจริง แต่กลายเป็นกล่องเปล่าท้ายหน้า เหมือนกดแล้วไม่มีอะไรเกิดขึ้น
  -->
  <style>
    .lightbox {
      position: fixed;
      inset: 0;
      top: 0; right: 0; bottom: 0; left: 0;   /* เผื่อเบราว์เซอร์เก่าที่ไม่รู้จัก inset */
      z-index: 9999;                          /* สูงกว่า bottom-nav (100) */
      background: rgba(0,0,0,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 16px;
      animation: lb-fade 0.18s ease;
    }
    /* ต้องมีกฎนี้ในไฟล์เดียวกับ .lightbox ไม่งั้นถ้า [hidden] ของ main.css ไม่ถูกโหลด
       popup จะโผล่ค้างเต็มจอตั้งแต่เปิดหน้า */
    .lightbox[hidden] { display: none !important; }

    @keyframes lb-fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .lightbox-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      animation: lb-zoom 0.2s ease;
      -webkit-user-drag: none;   /* กันเบราว์เซอร์ลากรูปออกไปตอนสไวป์ */
      user-select: none;
    }

    @keyframes lb-zoom {
      from { transform: scale(0.94); }
      to   { transform: scale(1); }
    }

    .lightbox-btn {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: rgba(255,255,255,0.16);
      color: #ffffff;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      width: 44px;               /* พื้นที่กดอย่างน้อย 44px ตามขนาดนิ้วบนมือถือ */
      height: 44px;
      transition: background 0.2s ease;
    }
    .lightbox-btn:hover  { background: rgba(255,255,255,0.3); }
    .lightbox-btn:active { background: rgba(255,255,255,0.4); }
    .lightbox-btn[hidden] { display: none !important; }

    .lightbox-close { top: 12px; right: 12px; }
    .lightbox-prev  { left: 10px;  top: 50%; transform: translateY(-50%); }
    .lightbox-next  { right: 10px; top: 50%; transform: translateY(-50%); }

    .lightbox-count {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.85);
      font-size: 0.82rem;
      font-weight: 500;
      background: rgba(0,0,0,0.45);
      padding: 5px 14px;
      border-radius: 999px;
    }
    .lightbox-count[hidden] { display: none !important; }

    /* จอเล็ก: ย้ายปุ่มซ้าย-ขวาลงมาชิดขอบล่าง ไม่ให้บังรูป */
    @media (max-width: 420px) {
      .lightbox { padding: 56px 8px 72px; }
      .lightbox-prev { left: 16px;  top: auto; bottom: 12px; transform: none; }
      .lightbox-next { right: 16px; top: auto; bottom: 12px; transform: none; }
    }

    /* รูปเล็กในกล่องสไลด์ — บอกให้รู้ว่ากดได้ */
    .info-scroll .info-img { cursor: zoom-in; }

    body.lightbox-open { overflow: hidden; }
  </style>
</head>
<body>

  <!-- Header: ทักทาย + รูปโปรไฟล์ -->
  <header class="app-header">
    <span id="welcome-text" class="welcome-text">กำลังโหลด...</span>
    <img src="images/account_circle_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.png" alt="Profile" class="profile-pic">
  </header>

  <!-- เนื้อหาหลัก -->
  <main class="app-content">

    <!-- กล่องขาวหลัก -->
    <div class="white-card">
       <img src="images/FutureWay (5).png" style="width: 100%; height: auto;">

      <a href="#" class="link-title">รายชื่อมหาวิทยาลัยและสถาบันต่าง ๆ ที่เปิดรับสมัคร</a>
      <div class="blue-badge">ข้อมูลการรับสมัครของมหาวิทยาลัย ปีการศึกษา 2569</div>

      <a href="quiz.html" class="test-btn">คลิ๊ก.. เพื่อทำแบบทดสอบ</a>

    </div>

    <!-- กล่องสไลด์รูปภาพด้านล่าง (กดที่รูปเพื่อดูเต็มจอ) -->
    <div class="info-scroll">
      <img src="images/info1 (2).png" alt="Info 1" class="info-img" tabindex="0" role="button">
      <img src="images/info2 (3).png" alt="Info 2" class="info-img" tabindex="0" role="button">
    </div>

  </main>

  <!-- Lightbox: ดูรูปเต็มจอ -->
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="ดูรูปภาพเต็มจอ">
    <!-- ไม่ใส่ src เปล่าไว้ตั้งแต่แรก เดี๋ยวเบราว์เซอร์ยิงโหลด URL ของหน้านี้ซ้ำ -->
    <img class="lightbox-img" id="lightbox-img" alt="">

    <button type="button" class="lightbox-btn lightbox-close" id="lb-close" aria-label="ปิด">
      <i class="fas fa-xmark"></i>
    </button>
    <button type="button" class="lightbox-btn lightbox-prev" id="lb-prev" aria-label="รูปก่อนหน้า">
      <i class="fas fa-chevron-left"></i>
    </button>
    <button type="button" class="lightbox-btn lightbox-next" id="lb-next" aria-label="รูปถัดไป">
      <i class="fas fa-chevron-right"></i>
    </button>

    <span class="lightbox-count" id="lb-count"></span>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item active">
      <div class="icon-circle">
        <i class="fas fa-home"></i>
      </div>
      <span>หน้าหลัก</span>
    </a>
    <a href="History_Results.html" class="nav-item">
      <i class="fas fa-chart-bar"></i>
      <span>ประวัติ/ผลลัพธ์</span>
    </a>
    <a href="chat.html" class="nav-item">
      <i class="fas fa-comment-dots"></i>
      <span>แชท</span>
    </a>
    <a href="profile.html" class="nav-item">
      <i class="fas fa-user-cog"></i>
      <span>การตั้งค่า</span>
    </a>
  </nav>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      fetch('php/get_user.php', { cache: 'no-store' })
        .then(r => r.json())
        .then(data => {
          const el = document.getElementById('welcome-text');
          el.innerHTML = data.success ? 'สวัสดี, ' + data.fullname : 'กรุณาเข้าสู่ระบบ';
        })
        .catch(() => {
          document.getElementById('welcome-text').innerHTML = 'ข้อผิดพลาด';
        });
    });
  </script>

  <script>
    // ========================================
    // Lightbox — กดที่รูปในกล่องสไลด์แล้วเปิดดูเต็มจอ
    // เลื่อนดูรูปถัดไปได้ด้วยปุ่มลูกศร, คีย์บอร์ด, หรือสไวป์บนมือถือ
    // ========================================
    (function () {
      const images  = Array.from(document.querySelectorAll('.info-scroll .info-img'));
      const box     = document.getElementById('lightbox');
      const bigImg  = document.getElementById('lightbox-img');
      const btnPrev = document.getElementById('lb-prev');
      const btnNext = document.getElementById('lb-next');
      const btnClose= document.getElementById('lb-close');
      const counter = document.getElementById('lb-count');

      // ถ้าขาดชิ้นไหนไป ให้ฟ้องใน Console ไปเลย จะได้ไม่ต้องเดาว่าทำไมกดรูปแล้วเงียบ
      if (!images.length || !box || !bigImg) {
        console.error('[lightbox] เปิดใช้งานไม่ได้ — ' +
          'รูปในกล่องสไลด์: ' + images.length + ', กล่อง popup: ' + (box ? 'มี' : 'ไม่มี'));
        return;
      }
      console.log('[lightbox] พร้อมใช้งาน — พบรูป ' + images.length + ' รูป');

      let index = 0;
      let lastFocused = null;   // ปุ่ม/รูปที่กดเข้ามา ไว้คืน focus ตอนปิด

      function show(i) {
        // วนกลับหัวท้าย: รูปสุดท้ายกดถัดไปแล้ววนมารูปแรก
        index = (i + images.length) % images.length;
        const src = images[index];

        bigImg.src = src.src;
        bigImg.alt = src.alt || '';

        counter.textContent = (index + 1) + ' / ' + images.length;

        // มีรูปเดียวก็ไม่ต้องมีปุ่มเลื่อนกับตัวนับ
        const many = images.length > 1;
        btnPrev.hidden = !many;
        btnNext.hidden = !many;
        counter.hidden = !many;
      }

      function open(i) {
        lastFocused = document.activeElement;
        show(i);

        // สั่งทั้ง attribute hidden และ inline style
        // เผื่อกรณีที่กฎ CSS ของ [hidden] ไม่ถูกโหลด popup จะได้ยังโผล่แน่นอน
        box.hidden = false;
        box.style.display = 'flex';

        document.body.classList.add('lightbox-open');
        btnClose.focus();
      }

      function close() {
        box.hidden = true;
        box.style.display = 'none';
        document.body.classList.remove('lightbox-open');
        // ใช้ removeAttribute ไม่ใช่ src='' เพราะ src ว่างทำให้เบราว์เซอร์
        // ยิงโหลด URL ของหน้านี้ซ้ำอีกรอบ
        bigImg.removeAttribute('src');
        if (lastFocused) lastFocused.focus();
      }

      // ---- เปิดจากรูปเล็ก ----
      images.forEach((img, i) => {
        img.addEventListener('click', () => open(i));
        img.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();       // กัน space เลื่อนหน้าลง
            open(i);
          }
        });
      });

      // ---- ปุ่มควบคุม ----
      btnClose.addEventListener('click', close);
      btnPrev.addEventListener('click', () => show(index - 1));
      btnNext.addEventListener('click', () => show(index + 1));

      // กดพื้นดำรอบ ๆ เพื่อปิด แต่กดที่ตัวรูปหรือปุ่มไม่ปิด
      box.addEventListener('click', e => {
        if (e.target === box) close();
      });

      // ---- คีย์บอร์ด ----
      document.addEventListener('keydown', e => {
        if (box.hidden) return;
        if (e.key === 'Escape')     close();
        if (e.key === 'ArrowLeft')  show(index - 1);
        if (e.key === 'ArrowRight') show(index + 1);
      });

      // ---- สไวป์ซ้าย-ขวาบนมือถือ ----
      // ใช้ระยะ 50px กันนิ้วสั่นตอนแตะให้กลายเป็นการปัดโดยไม่ตั้งใจ
      let touchX = null;
      box.addEventListener('touchstart', e => {
        touchX = e.changedTouches[0].clientX;
      }, { passive: true });

      box.addEventListener('touchend', e => {
        if (touchX === null || images.length < 2) return;
        const diff = e.changedTouches[0].clientX - touchX;
        if (Math.abs(diff) > 50) show(diff < 0 ? index + 1 : index - 1);
        touchX = null;
      }, { passive: true });
    })();
  </script>

</body>
</html>
