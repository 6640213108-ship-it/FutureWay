<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FutureWay - หน้าหลัก</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/lightbox.css">
</head>
<body>

  <header class="app-header">
    <span id="welcome-text" class="welcome-text">กำลังโหลด...</span>
    <img src="images/account_circle_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.png" alt="Profile" class="profile-pic">
  </header>

  <main class="app-content">

    <div class="white-card">
      <img src="images/futureway-logo.png" alt="FutureWay" class="card-logo">
      <a href="#" class="link-title">รายชื่อมหาวิทยาลัยและสถาบันต่าง ๆ ที่เปิดรับสมัคร</a>
      <div class="blue-badge">ข้อมูลการรับสมัครของมหาวิทยาลัย ปีการศึกษา 2569</div>
      <a href="quiz.html" class="test-btn">คลิ๊ก.. เพื่อทำแบบทดสอบ</a>
    </div>

    <!-- เมนูบุคลิกภาพ MBTI ทั้ง 16 แบบ — render จาก js/data.js (กดแล้วเปิดดูรูปเต็มจอ) -->
    <div class="white-card">
      <h2 class="mbti-title"><i class="fas fa-brain"></i> บุคลิกภาพ MBTI ทั้ง 16 แบบ</h2>
      <div class="mbti-grid" id="mbti-grid"></div>
    </div>

    <!-- กล่องสไลด์รูปภาพ (กดที่รูปเพื่อดูเต็มจอ) -->
    <div class="info-scroll">
      <img src="images/info-quiz.png" alt="วิธีทำแบบทดสอบ" class="info-img" tabindex="0" role="button">
      <img src="images/info-result.png" alt="ตัวอย่างผลลัพธ์" class="info-img" tabindex="0" role="button">
    </div>

  </main>

  <!-- Lightbox: ดูรูปเต็มจอ (ควบคุมโดย js/lightbox.js) -->
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="ดูรูปภาพเต็มจอ">
    <div class="lightbox-stage" id="lb-stage">
      <img class="lightbox-img" id="lightbox-img" alt="">
    </div>
    <button type="button" class="lightbox-btn lightbox-close" id="lb-close" aria-label="ปิด"><i class="fas fa-xmark"></i></button>
    <button type="button" class="lightbox-btn lightbox-zoom" id="lb-zoom" aria-label="ขยายรูป"><i class="fas fa-magnifying-glass-plus"></i></button>
    <button type="button" class="lightbox-btn lightbox-prev" id="lb-prev" aria-label="รูปก่อนหน้า"><i class="fas fa-chevron-left"></i></button>
    <button type="button" class="lightbox-btn lightbox-next" id="lb-next" aria-label="รูปถัดไป"><i class="fas fa-chevron-right"></i></button>
    <span class="lightbox-count" id="lb-count"></span>
  </div>

  <nav class="bottom-nav" data-active="home"></nav>

  <script src="js/common.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/lightbox.js"></script>
</body>
</html>
