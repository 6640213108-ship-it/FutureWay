<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FutureWay</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- ?v=2 บังคับให้เบราว์เซอร์โหลด CSS ใหม่ ไม่ใช้ตัวที่ cache ไว้
       (เลขนี้เปลี่ยนทุกครั้งที่แก้ main.css แล้วอยากให้ผู้ใช้เห็นผลทันที) -->
  <link rel="stylesheet" href="css/main.css?v=2">

  <!--
    สไตล์ของ Lightbox (popup ดูรูปเต็มจอ) อยู่ตรงนี้ ไม่ได้อยู่ใน main.css
    เพราะถ้า CSS ถูก cache ไว้ จะได้ HTML+script ใหม่แต่ไม่ได้สไตล์
    ผลคือกดรูปแล้ว popup เปิดจริง แต่กลายเป็นกล่องเปล่าท้ายหน้า เหมือนกดแล้วไม่มีอะไรเกิดขึ้น
  -->
  <style>
    .lightbox {
      position: fixed;
      top: 0; left: 0; right: 0;
      width: 100%;
      height: 100vh;    /* ค่าสำรองสำหรับเบราว์เซอร์เก่า */
      height: 100dvh;   /* มือถือ: หักความสูงแถบ address bar ที่ยืด-หดตอนเลื่อนให้เอง
                           ถ้าใช้ 100vh เฉย ๆ ขอบล่างของรูปจะโดนแถบนั้นบังบน iOS/Android */
      z-index: 9999;    /* สูงกว่า bottom-nav (100) */
      background: rgba(0,0,0,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      /* เว้นที่ให้ปุ่มปิดด้านบน + ปุ่มเลื่อน/ตัวเลขด้านล่าง
         env(safe-area-inset-*) คือเผื่อรอยบากกับแถบขีดล่างของ iPhone */
      padding-top:    calc(58px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(58px + env(safe-area-inset-bottom, 0px));
      padding-left:   calc(12px + env(safe-area-inset-left, 0px));
      padding-right:  calc(12px + env(safe-area-inset-right, 0px));
      animation: lb-fade 0.18s ease;
    }
    /* ต้องมีกฎนี้ในไฟล์เดียวกับ .lightbox ไม่งั้นถ้า [hidden] ของ main.css ไม่ถูกโหลด
       popup จะโผล่ค้างเต็มจอตั้งแต่เปิดหน้า */
    .lightbox[hidden] { display: none !important; }

    @keyframes lb-fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* พื้นที่วางรูป — แยกออกมาจาก .lightbox เพื่อให้เลื่อนดูรูปตอนขยายได้
       โดยที่ปุ่มต่าง ๆ ยังเกาะขอบจออยู่กับที่ ไม่เลื่อนตามรูป */
    .lightbox-stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      overscroll-behavior: contain;   /* เลื่อนจนสุดแล้วไม่ไปลากหน้าข้างหลังต่อ */
      -webkit-overflow-scrolling: touch;
    }

    /* โหมดปกติ: ย่อให้เห็นทั้งรูปพอดีจอ ไม่ว่าจะจอไหน
       width/height เป็น auto + max 100% => รูปไม่ถูกยืดเกินขนาดจริงจนแตก */
    .lightbox-img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      cursor: zoom-in;
      animation: lb-zoom 0.2s ease;
      -webkit-user-drag: none;   /* กันเบราว์เซอร์ลากรูปออกไปตอนสไวป์ */
      user-select: none;
    }

    /* โหมดขยาย: บนมือถือให้เต็มความกว้างจอแล้วเลื่อนอ่านลงมา
       (รูป infographic แนวตั้งถ้าย่อให้พอดีจอจะเล็กจนอ่านตัวหนังสือไม่ออก) */
    .lightbox-stage.zoomed { align-items: flex-start; }
    .lightbox-stage.zoomed .lightbox-img {
      max-width: none;
      max-height: none;
      width: 100%;
      height: auto;
      border-radius: 0;
      cursor: zoom-out;
    }

    /* จอใหญ่: ขยายแล้วแสดงที่ขนาดจริงของไฟล์ ไม่ยืดเกินจนภาพเบลอ */
    @media (min-width: 900px) {
      .lightbox-stage.zoomed .lightbox-img {
        width: auto;
        height: auto;
      }
    }

    @keyframes lb-zoom {
      from { transform: scale(0.94); }
      to   { transform: scale(1); }
    }

    .lightbox-btn {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: rgba(255,255,255,0.16);
      color: #ffffff;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      width: 44px;               /* พื้นที่กดอย่างน้อย 44px ตามขนาดนิ้วบนมือถือ */
      height: 44px;
      transition: background 0.2s ease;
    }
    .lightbox-btn:hover  { background: rgba(255,255,255,0.3); }
    .lightbox-btn:active { background: rgba(255,255,255,0.4); }
    .lightbox-btn[hidden] { display: none !important; }

    /* ปุ่มเกาะขอบจอ ไม่ใช่ขอบรูป จะได้อยู่ที่เดิมเสมอไม่ว่ารูปจะขนาดไหน
       บวก safe-area เผื่อรอยบาก iPhone ไม่ให้ปุ่มไปอยู่ใต้รอยบาก */
    .lightbox-close {
      top:   calc(12px + env(safe-area-inset-top, 0px));
      right: calc(12px + env(safe-area-inset-right, 0px));
    }
    .lightbox-zoom {
      top:  calc(12px + env(safe-area-inset-top, 0px));
      left: calc(12px + env(safe-area-inset-left, 0px));
    }
    .lightbox-prev  { left: 10px;  top: 50%; transform: translateY(-50%); }
    .lightbox-next  { right: 10px; top: 50%; transform: translateY(-50%); }

    .lightbox-count {
      position: absolute;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.85);
      font-size: 0.82rem;
      font-weight: 500;
      background: rgba(0,0,0,0.45);
      padding: 5px 14px;
      border-radius: 999px;
    }
    .lightbox-count[hidden] { display: none !important; }

    /* จอแคบ: ย้ายปุ่มซ้าย-ขวาลงมาชิดขอบล่าง ไม่ให้บังตัวรูป
       (จอกว้าง ๆ ปุ่มอยู่กลางซ้าย-ขวาได้ เพราะมีที่ว่างข้างรูปเหลือเฟือ) */
    @media (max-width: 480px) {
      .lightbox {
        padding-left:   calc(6px + env(safe-area-inset-left, 0px));
        padding-right:  calc(6px + env(safe-area-inset-right, 0px));
        padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px));
      }
      .lightbox-prev {
        left: 16px; right: auto; top: auto;
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        transform: none;
      }
      .lightbox-next {
        right: 16px; left: auto; top: auto;
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        transform: none;
      }
    }

    /* จอเตี้ย (มือถือแนวนอน / หน้าต่างเล็ก): ลดขอบและย่อปุ่ม
       ไม่งั้นขอบบน-ล่างรวมกันกินที่จนรูปเหลือนิดเดียว */
    @media (max-height: 460px) {
      .lightbox {
        padding-top:    calc(46px + env(safe-area-inset-top, 0px));
        padding-bottom: calc(46px + env(safe-area-inset-bottom, 0px));
      }
      .lightbox-btn { width: 38px; height: 38px; font-size: 0.95rem; }
      .lightbox-count { bottom: 8px; font-size: 0.75rem; padding: 3px 11px; }
    }

    /* รูปเล็กในกล่องสไลด์ — บอกให้รู้ว่ากดได้ */
    .info-scroll .info-img { cursor: zoom-in; }

    body.lightbox-open { overflow: hidden; }
  </style>
</head>
<body>

  <!-- Header: ทักทาย + รูปโปรไฟล์ -->
  <header class="app-header">
    <span id="welcome-text" class="welcome-text">กำลังโหลด...</span>
    <img src="images/account_circle_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.png" alt="Profile" class="profile-pic">
  </header>

  <!-- เนื้อหาหลัก -->
  <main class="app-content">

    <!-- กล่องขาวหลัก -->
    <div class="white-card">
       <img src="images/FutureWay (5).png" style="width: 100%; height: auto;">

      <a href="#" class="link-title">รายชื่อมหาวิทยาลัยและสถาบันต่าง ๆ ที่เปิดรับสมัคร</a>
      <div class="blue-badge">ข้อมูลการรับสมัครของมหาวิทยาลัย ปีการศึกษา 2569</div>

      <a href="quiz.html" class="test-btn">คลิ๊ก.. เพื่อทำแบบทดสอบ</a>

    </div>

    <!-- กล่องสไลด์รูปภาพด้านล่าง (กดที่รูปเพื่อดูเต็มจอ) -->
    <div class="info-scroll">
      <img src="images/info1 (2).png" alt="Info 1" class="info-img" tabindex="0" role="button">
      <img src="images/info2 (3).png" alt="Info 2" class="info-img" tabindex="0" role="button">
    </div>

  </main>

  <!-- Lightbox: ดูรูปเต็มจอ -->
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="ดูรูปภาพเต็มจอ">
    <!-- พื้นที่วางรูป เลื่อนได้ตอนกดขยาย ส่วนปุ่มอยู่นอกกล่องนี้จึงไม่เลื่อนตาม -->
    <div class="lightbox-stage" id="lb-stage">
      <!-- ไม่ใส่ src เปล่าไว้ตั้งแต่แรก เดี๋ยวเบราว์เซอร์ยิงโหลด URL ของหน้านี้ซ้ำ -->
      <img class="lightbox-img" id="lightbox-img" alt="">
    </div>

    <button type="button" class="lightbox-btn lightbox-close" id="lb-close" aria-label="ปิด">
      <i class="fas fa-xmark"></i>
    </button>
    <button type="button" class="lightbox-btn lightbox-zoom" id="lb-zoom" aria-label="ขยายรูป">
      <i class="fas fa-magnifying-glass-plus"></i>
    </button>
    <button type="button" class="lightbox-btn lightbox-prev" id="lb-prev" aria-label="รูปก่อนหน้า">
      <i class="fas fa-chevron-left"></i>
    </button>
    <button type="button" class="lightbox-btn lightbox-next" id="lb-next" aria-label="รูปถัดไป">
      <i class="fas fa-chevron-right"></i>
    </button>

    <span class="lightbox-count" id="lb-count"></span>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item active">
      <div class="icon-circle">
        <i class="fas fa-home"></i>
      </div>
      <span>หน้าหลัก</span>
    </a>
    <a href="History_Results.html" class="nav-item">
      <i class="fas fa-chart-bar"></i>
      <span>ประวัติ/ผลลัพธ์</span>
    </a>
    <a href="chat.html" class="nav-item">
      <i class="fas fa-comment-dots"></i>
      <span>แชท</span>
    </a>
    <a href="profile.html" class="nav-item">
      <i class="fas fa-user-cog"></i>
      <span>การตั้งค่า</span>
    </a>
  </nav>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      fetch('php/get_user.php', { cache: 'no-store' })
        .then(r => r.json())
        .then(data => {
          const el = document.getElementById('welcome-text');
          el.innerHTML = data.success ? 'สวัสดี, ' + data.fullname : 'กรุณาเข้าสู่ระบบ';
        })
        .catch(() => {
          document.getElementById('welcome-text').innerHTML = 'ข้อผิดพลาด';
        });
    });
  </script>

  <script>
    // ========================================
    // Lightbox — กดที่รูปในกล่องสไลด์แล้วเปิดดูเต็มจอ
    // เลื่อนดูรูปถัดไปได้ด้วยปุ่มลูกศร, คีย์บอร์ด, หรือสไวป์บนมือถือ
    // ========================================
    (function () {
      const images  = Array.from(document.querySelectorAll('.info-scroll .info-img'));
      const box     = document.getElementById('lightbox');
      const stage   = document.getElementById('lb-stage');
      const bigImg  = document.getElementById('lightbox-img');
      const btnPrev = document.getElementById('lb-prev');
      const btnNext = document.getElementById('lb-next');
      const btnClose= document.getElementById('lb-close');
      const btnZoom = document.getElementById('lb-zoom');
      const counter = document.getElementById('lb-count');

      // ถ้าขาดชิ้นไหนไป ให้ฟ้องใน Console ไปเลย จะได้ไม่ต้องเดาว่าทำไมกดรูปแล้วเงียบ
      if (!images.length || !box || !stage || !bigImg || !btnZoom) {
        console.error('[lightbox] เปิดใช้งานไม่ได้ — ' +
          'รูปในกล่องสไลด์: ' + images.length + ', กล่อง popup: ' + (box ? 'มี' : 'ไม่มี'));
        return;
      }
      console.log('[lightbox] พร้อมใช้งาน — พบรูป ' + images.length + ' รูป');

      let index = 0;
      let zoomed = false;
      let lastFocused = null;   // ปุ่ม/รูปที่กดเข้ามา ไว้คืน focus ตอนปิด

      // ---- โหมดขยาย ----
      // ปกติจะย่อรูปให้เห็นครบพอดีจอ กดขยายแล้วรูปจะเต็มความกว้างจอและเลื่อนอ่านลงมาได้
      function setZoom(on) {
        zoomed = on;
        stage.classList.toggle('zoomed', on);
        btnZoom.querySelector('i').className =
          on ? 'fas fa-magnifying-glass-minus' : 'fas fa-magnifying-glass-plus';
        btnZoom.setAttribute('aria-label', on ? 'ย่อรูป' : 'ขยายรูป');
        stage.scrollTop  = 0;
        stage.scrollLeft = 0;
      }

      function show(i) {
        // วนกลับหัวท้าย: รูปสุดท้ายกดถัดไปแล้ววนมารูปแรก
        index = (i + images.length) % images.length;
        const src = images[index];

        setZoom(false);          // เปลี่ยนรูปแล้วเริ่มที่โหมดพอดีจอเสมอ
        bigImg.src = src.src;
        bigImg.alt = src.alt || '';

        counter.textContent = (index + 1) + ' / ' + images.length;

        // มีรูปเดียวก็ไม่ต้องมีปุ่มเลื่อนกับตัวนับ
        const many = images.length > 1;
        btnPrev.hidden = !many;
        btnNext.hidden = !many;
        counter.hidden = !many;
      }

      // รูปที่เล็กกว่าพื้นที่อยู่แล้ว = เห็นเต็มขนาดจริงตั้งแต่แรก ไม่ต้องมีปุ่มขยายให้รก
      bigImg.addEventListener('load', function () {
        btnZoom.hidden = bigImg.naturalWidth  <= stage.clientWidth
                      && bigImg.naturalHeight <= stage.clientHeight;
      });

      function open(i) {
        lastFocused = document.activeElement;
        show(i);

        // สั่งทั้ง attribute hidden และ inline style
        // เผื่อกรณีที่กฎ CSS ของ [hidden] ไม่ถูกโหลด popup จะได้ยังโผล่แน่นอน
        box.hidden = false;
        box.style.display = 'flex';

        document.body.classList.add('lightbox-open');
        btnClose.focus();
      }

      function close() {
        box.hidden = true;
        box.style.display = 'none';
        document.body.classList.remove('lightbox-open');
        // ใช้ removeAttribute ไม่ใช่ src='' เพราะ src ว่างทำให้เบราว์เซอร์
        // ยิงโหลด URL ของหน้านี้ซ้ำอีกรอบ
        bigImg.removeAttribute('src');
        if (lastFocused) lastFocused.focus();
      }

      // ---- เปิดจากรูปเล็ก ----
      images.forEach((img, i) => {
        img.addEventListener('click', () => open(i));
        img.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();       // กัน space เลื่อนหน้าลง
            open(i);
          }
        });
      });

      // ---- ปุ่มควบคุม ----
      btnClose.addEventListener('click', close);
      btnPrev.addEventListener('click', () => show(index - 1));
      btnNext.addEventListener('click', () => show(index + 1));

      // กดที่ตัวรูปก็สลับย่อ/ขยายได้ ไม่ต้องเล็งปุ่ม
      btnZoom.addEventListener('click', () => setZoom(!zoomed));
      bigImg.addEventListener('click', () => { if (!btnZoom.hidden) setZoom(!zoomed); });

      // กดพื้นดำรอบ ๆ เพื่อปิด แต่กดที่ตัวรูปหรือปุ่มไม่ปิด
      box.addEventListener('click', e => {
        if (e.target === box || e.target === stage) close();
      });

      // ---- คีย์บอร์ด ----
      document.addEventListener('keydown', e => {
        if (box.hidden) return;
        if (e.key === 'Escape')     close();
        if (e.key === 'ArrowLeft')  show(index - 1);
        if (e.key === 'ArrowRight') show(index + 1);
      });

      // ---- สไวป์ซ้าย-ขวาบนมือถือ ----
      // ใช้ระยะ 50px กันนิ้วสั่นตอนแตะให้กลายเป็นการปัดโดยไม่ตั้งใจ
      let touchX = null;
      box.addEventListener('touchstart', e => {
        touchX = e.changedTouches[0].clientX;
      }, { passive: true });

      box.addEventListener('touchend', e => {
        // ตอนขยายอยู่ไม่ต้องเปลี่ยนรูป เพราะนิ้วกำลังลากเลื่อนดูรูปเดิม
        if (touchX === null || images.length < 2 || zoomed) { touchX = null; return; }
        const diff = e.changedTouches[0].clientX - touchX;
        if (Math.abs(diff) > 50) show(diff < 0 ? index + 1 : index - 1);
        touchX = null;
      }, { passive: true });
    })();
  </script>

</body>
</html>
