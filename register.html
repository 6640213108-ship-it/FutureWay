<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FutureWay - สมัครสมาชิก</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="box">
    <h1 class="title">FutureWay</h1>
    <h2 class="subtitle">ยินดีต้อนรับสมาชิกใหม่</h2>
    <p class="desc">เรารู้สึกยินดีที่ได้คุณมาที่นี่</p>
    <small class="note">กรุณากรอกข้อมูลเพื่อเริ่มต้นการใช้งาน</small>

    <form id="register-form">

      <div class="input-box">
        <i class="fa-solid fa-phone icon-left"></i>
        <input type="tel" name="phone" placeholder="เบอร์มือถือ" inputmode="numeric" autocomplete="tel"
               pattern="0[0-9]{9}" maxlength="10" title="กรอกเบอร์มือถือ 10 หลัก เช่น 0812345678" required>
      </div>

      <div class="input-box">
        <img src="images/account_box_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.png" class="icon" alt="">
        <input type="text" name="firstname" placeholder="ชื่อ" autocomplete="given-name" maxlength="100" required>
      </div>

      <div class="input-box">
        <img src="images/account_box_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.png" class="icon" alt="">
        <input type="text" name="lastname" placeholder="นามสกุล" autocomplete="family-name" maxlength="100" required>
      </div>

      <div class="input-box">
        <img src="images/mail_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.png" class="icon" alt="">
        <input type="email" name="email" placeholder="อีเมล" autocomplete="email" maxlength="150" required>
      </div>

      <div class="input-box">
        <i class="fa-solid fa-lock icon-left"></i>
        <input type="password" name="password" id="password" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)"
               autocomplete="new-password" minlength="6" required>
        <i class="fa-solid fa-eye toggle" data-target="password" role="button" aria-label="แสดงรหัสผ่าน"></i>
      </div>

      <div class="input-box">
        <i class="fa-solid fa-lock icon-left"></i>
        <input type="password" name="confirm_password" id="confirm-password" placeholder="ยืนยันรหัสผ่าน"
               autocomplete="new-password" required>
        <i class="fa-solid fa-eye toggle" data-target="confirm-password" role="button" aria-label="แสดงรหัสผ่าน"></i>
      </div>

      <div class="input-box">
        <select name="gender" required>
          <option value="">เลือกเพศ</option>
          <option value="ชาย">ชาย</option>
          <option value="หญิง">หญิง</option>
          <option value="อื่นๆ">อื่นๆ</option>
        </select>
      </div>

      <div class="form-footer">
        <button type="submit" class="btn btn-purple">สมัครสมาชิก</button>
        <a href="login.html" class="btn-purple-outline_t">มีบัญชีอยู่แล้ว? เข้าสู่ระบบ</a>
      </div>

    </form>

    <div class="divider">หรือสมัครด้วย</div>

    <div class="social-buttons">
      <button type="button" class="btn-social google">
        <img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" alt="Google"> Google
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="js/common.js"></script>
  <script src="js/google-login.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
