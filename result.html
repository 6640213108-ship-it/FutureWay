<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FutureWay - ผลลัพธ์</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/result.css">
</head>
<body>

  <header class="back-header" data-title="ผลลัพธ์ของคุณ" data-back="quiz.html"></header>

  <div id="loading-wrap" class="loading-wrap">
    <div class="loading-spinner"></div>
    <p class="loading-text">กำลังวิเคราะห์ข้อมูล...</p>
  </div>

  <!-- ผลลัพธ์ (ซ่อนไว้จน js/result.js โหลดข้อมูลเสร็จ) -->
  <div id="result-wrap" hidden>

    <div class="result-hero mbti-hero">
      <div class="mbti-hero-text">
        <div class="mbti-badge" id="mbti-display">—</div>
        <p class="mbti-card-title" id="mbti-title"></p>
        <p class="mbti-card-subtitle" id="mbti-subtitle"></p>
      </div>
    </div>

    <div class="result-content">

      <div class="mbti-info-grid">
        <div class="mbti-info-box">
          <p class="mbti-info-title"><i class="fas fa-brain"></i> ลักษณะบุคลิกภาพ</p>
          <ul id="mbti-traits-list"></ul>
        </div>
        <div class="mbti-info-box highlight">
          <p class="mbti-info-title"><i class="fas fa-star"></i> จุดเด่น</p>
          <ul id="mbti-strengths-list"></ul>
        </div>
      </div>

      <p class="result-section-title"><i class="fas fa-briefcase"></i> สาขาที่เหมาะสมกับ</p>
      <!-- โปสเตอร์ MBTI (images/XXXX.jpg) เปลี่ยนตามรหัสที่คำนวณได้ -->
      <img id="mbti-branch-image" class="mbti-branch-image" alt="" loading="lazy" hidden>

      <p class="result-hero-sub" id="avg-grade-display"></p>
      <p class="result-section-title" id="summary-title">📊 เกรดของคุณ</p>
      <div class="grade-summary" id="grade-summary"></div>

      <a href="quiz.html" class="retry-btn"><i class="fas fa-redo"></i> ทำแบบทดสอบใหม่</a>

    </div>
  </div>

  <div id="error-wrap" class="error-wrap" hidden>
    <i class="fas fa-exclamation-circle error-icon"></i>
    <p id="error-msg">เกิดข้อผิดพลาด</p>
    <a href="quiz.html" class="error-link">← กลับไปทำใหม่</a>
  </div>

  <nav class="bottom-nav" data-active="history"></nav>

  <script src="js/common.js"></script>
  <script src="js/data.js"></script>
  <script src="js/result.js"></script>
</body>
</html>
